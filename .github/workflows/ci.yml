name: CI

# This skill preaches "gate secrets, lint workflows, validate structure, keep CI green"
# (see SKILL.md dimensions 8, 11, 18) — so it runs those same gates on itself.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan entire history, not just the tip
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks git --no-banner --redact .

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install + run actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  helper-scripts:
    name: Helper scripts (shellcheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck the shipped scripts
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y shellcheck
          shellcheck -S warning scripts/*.sh
      - name: ruff the shipped Python (pinned)
        # Added because its absence was caught by the thing it should have caught: three UP031
        # findings sat in scripts/semgrep-rules/py-path-write-without-containment.py through four
        # passes of work. The README lists ruff in the toolkit and this repo claims to run the
        # gates it recommends -- so not running it was an overstated coverage claim of exactly the
        # kind dimension 12 exists to catch.
        #
        # The semgrep fixtures are IN scope deliberately. They are planted-defect files, so the
        # temptation is to exempt them; but the defect each one plants is a *security* shape, not a
        # formatting one, and a fixture is still code a contributor reads and copies. Where a lint
        # rule genuinely conflicts with the planted defect, silence it with a narrow `# noqa: <code>`
        # carrying the reason -- never widen an exclude, which would blind this step to the next file.
        #
        # Negative control (measured, not assumed): with the percent-format spellings restored in
        # that fixture this step reports "Found 3 errors" and fails.
        #
        # On ruff's `S` (flake8-bandit) rules, corrected after measuring: the policy is that we do not
        # SELECT `S`, because bandit owns that lane (S501 == B501) and enabling the set would report
        # every Python security finding twice. But ruff 0.16.1's DEFAULT rule set already includes
        # S102/S110/S112, so "the S rules stay off here" is not literally true and never was --
        # `try/except/pass` in py-failopen-on-exception.py is flagged by default and carries a narrow
        # `# noqa: S110` with its reason. Do not "fix" that by adding an `S`-wide ignore: that would
        # turn a 3-rule overlap into a blanket exemption and blind this step to the next fixture.
        run: |
          pip install --quiet ruff==0.16.1
          ruff check --no-cache .
      - name: Install semgrep (pinned)
        # Pinned to an exact version, not a range: dimension 18 asks the same of every submission,
        # and the rule gates were measured against this engine. A floating install would silently
        # test a different analyzer than the one the gates were written against.
        run: pip install --quiet semgrep==1.172.0
      - name: Run helper-script tests
        # The skill preaches "prove your regression tests are real guards" (dim 11), so every tool
        # it ships in scripts/ is tested and gated here. Register new scanners in test_scripts.sh --
        # this step and the shellcheck glob above both pick them up with no workflow change.
        #
        # The semgrep rule gates SKIP when semgrep is absent -- correct locally, where the tool is
        # optional, but wrong here: a failed install would silently drop every rule gate and this
        # job would still exit 0. So the output is asserted, not just the exit code.
        run: |
          # pipefail is MANDATORY here: the default GitHub shell is `bash -e`, so `script | tee`
          # would return tee's status and a failing test suite would pass this step silently.
          set -o pipefail
          bash scripts/test_scripts.sh | tee /tmp/helper-tests.log
          if grep -q 'SKIP.*semgrep' /tmp/helper-tests.log; then
            echo "::error::semgrep rule gates were SKIPPED -- the install did not take effect"; exit 1
          fi
          grep -q 'gate5-self' /tmp/helper-tests.log \
            || { echo "::error::gate5 self-check never ran"; exit 1; }

  release-consistency:
    name: Release consistency (tags <-> CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # need full history AND tags; a shallow clone has neither
      - name: Tags and CHANGELOG must agree
        # Added because this repo drifted exactly the way it warns others about. Commit 63e4fa0 was
        # titled "Release 1.1.0" and shipped a `## [1.1.0]` CHANGELOG section -- but no v1.1.0 tag
        # was ever created, so for three days the repo asserted a release that did not exist, while
        # 12 commits piled up past the last real tag. Dimension 12 (overstated coverage) and
        # dimension 18 (provenance) both name this shape; nothing was checking for it here.
        #
        # Three checks, deliberately bidirectional -- the drift can start from either side:
        #   1. a pushed tag vX.Y.Z must have a matching CHANGELOG section
        #   2. a commit claiming "Release X.Y.Z" must have the tag        <- caught 63e4fa0
        #   3. a CHANGELOG section for X.Y.Z must have the tag           <- notes written, no release
        # Checks 2 and 3 run on EVERY trigger, not just tag pushes, so the drift is caught on the PR
        # that introduces it rather than weeks later at release time.
        #
        # NOTE: the version headings in CHANGELOG.md use an EM DASH, not a hyphen. The regex accepts
        # either, so an editor's autocorrect cannot silently disable this gate -- a check that stops
        # matching is worse than no check, because it reads as passing.
        run: |
          python3 - "$GITHUB_REF" <<'PY'
          import re, subprocess, sys

          src = open("CHANGELOG.md").read()
          errs = []
          secs = {m.group(1) for m in
                  re.finditer(r'(?m)^## \[(\d+\.\d+\.\d+)\][ \t]*[\u2014-]', src)}
          tags = set(subprocess.run(["git", "tag", "--list", "v*"],
                                    capture_output=True, text=True).stdout.split())

          ref = sys.argv[1] if len(sys.argv) > 1 else ""
          if ref.startswith("refs/tags/"):
              tag = ref.split("/")[-1]
              ver = tag.lstrip("v")
              if not re.fullmatch(r'\d+\.\d+\.\d+', ver):
                  errs.append(f"tag {tag} is not a vX.Y.Z semantic version")
              elif ver not in secs:
                  errs.append(f"tag {tag} has no '## [{ver}]' section in CHANGELOG.md")

          log = subprocess.run(["git", "log", "--format=%h %s"],
                               capture_output=True, text=True).stdout
          for line in log.splitlines():
              sha, _, subj = line.partition(" ")
              m = re.match(r'(?i)release\s+v?(\d+\.\d+\.\d+)\b', subj.strip())
              if m and f"v{m.group(1)}" not in tags:
                  errs.append(f'commit {sha} claims "{subj}" but tag v{m.group(1)} does not exist')

          for ver in sorted(secs):
              if f"v{ver}" not in tags:
                  errs.append(f"CHANGELOG has a [{ver}] section but no tag v{ver}")

          print(f"CHANGELOG sections: {sorted(secs)}")
          print(f"tags present:       {sorted(tags)}")
          for e in errs:
              print(f"::error::{e}")
          sys.exit(1 if errs else 0)
          PY

  skill-structure:
    name: SKILL.md structure (Exchange-loadable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate SKILL.md frontmatter + body
        # Mirrors the Exchange skill-congruence check: SKILL.md at root with name/description
        # YAML frontmatter and a substantive body; no leftover template placeholders.
        run: |
          python3 - <<'PY'
          import sys, re
          src = open("SKILL.md").read()
          errs = []
          if not src.startswith("---"):
              errs.append("no YAML frontmatter delimiter at top")
          parts = src.split("---", 2)
          fm = parts[1] if len(parts) >= 3 else ""
          body = parts[2] if len(parts) >= 3 else ""
          if not re.search(r'(?m)^name:\s*\S', fm):        errs.append("frontmatter missing non-empty name:")
          if not re.search(r'(?m)^description:\s*\S', fm): errs.append("frontmatter missing non-empty description:")
          if len(body.strip()) < 500:                       errs.append("body is not substantive")
          for ph in ("your-github-username", "tag1", "reference memory"):
              if ph.lower() in src.lower():                 errs.append(f"leftover placeholder/ref: {ph}")
          # TODO/FIXME are banned as leftover markers but legitimately *named* in prose
          # (dimension 19 tells reviewers to require them on unfinished values). Rather than
          # drop the pattern -- which would blind the check to a real leftover -- exempt only
          # occurrences inside inline-code spans, so a bare one anywhere else still fails.
          prose = re.sub(r'`[^`\n]*`', '', src)
          for ph in ("TODO", "FIXME"):
              if ph.lower() in prose.lower():
                  errs.append(f"leftover marker outside inline code: {ph}")
          # every dimension 1..19 present as a numbered heading
          nums = set(int(n) for n in re.findall(r'(?m)^(\d+)\.\s+\*\*', body))
          missing = [n for n in range(1, 20) if n not in nums]
          if missing:                                       errs.append(f"missing dimension(s): {missing}")
          # The severity taxonomy must stay defined -- an unlabeled review makes an
          # efficiency note read like a credential leak, which is what it exists to prevent.
          # Only the four GRADED levels are severities; Informational is a bucket that carries
          # none, so it is checked as a heading below rather than as a table row. Requiring the
          # rows inside the Defects section keeps a stray bold mention elsewhere in the prose
          # from satisfying this -- the earlier version passed on exactly that accident.
          SEVERITIES = ("Critical", "High", "Medium", "Low")
          d0 = body.find("### 2. Defects")
          d1 = body.find("### 3. Informational")
          defects = body[d0:d1] if 0 <= d0 < d1 else ""
          if not defects:
              errs.append("cannot locate the Defects section to check the severity table")
          absent = [s for s in SEVERITIES if f"| **{s}** |" not in defects]
          if absent:                                        errs.append(f"severity row(s) missing from the Defects table: {absent}")
          # The three output buckets, in order. They encode *who decides against what standard*
          # (pulled gate / assigned severity / no severity), so dropping or reordering one is
          # what lets an efficiency note drift into the blocking list.
          BUCKETS = ("### 1. Rejection gates", "### 2. Defects", "### 3. Informational")
          at = [(b, body.find(b)) for b in BUCKETS]
          for b, i in at:
              if i < 0:                                     errs.append(f"output bucket missing: {b}")
          found = [i for _, i in at if i >= 0]
          if len(found) == len(BUCKETS) and found != sorted(found):
              errs.append("output buckets are out of order (gates -> defects -> informational)")
          # The two rules that keep an agent-assigned severity defensible. Whitespace is
          # normalized because these sentences wrap.
          flat = re.sub(r'\s+', ' ', body)
          for rule, key in (("severity must cite a basis", "Every severity must cite its basis"),
                            ("scanner may raise but not lower", "can only ever raise a finding, not lower one"),
                            ("CWE stays optional, not a severity source", "CWE is optional, and is classification")):
              if key not in flat:                           errs.append(f"missing rule: {rule}")
          if errs:
              print("SKILL.md validation FAILED:"); [print("  -", e) for e in errs]; sys.exit(1)
          print(f"SKILL.md valid: {len(nums)} dimensions, {len(SEVERITIES)} graded severities "
                f"+ Informational, {len(BUCKETS)} output buckets, body {len(body.strip())} chars")
          PY
      - name: Example review respects the buckets and defined labels
        # The example is what most readers copy, so a stale label or a severity attached to a
        # non-severity bucket propagates. Two checks: labels are defined, and severity appears
        # ONLY in the Defects bucket -- rejection gates are binary and informational items
        # carry no severity, so a label in either section is the drift this catches.
        run: |
          python3 - <<'PY'
          import re, sys
          skill = open("SKILL.md").read()
          example = open("examples/sample-review.md").read()
          # Severity labels the example may use = exactly the rows of SKILL.md's Defects table.
          # Derived from SKILL.md rather than hardcoded, so renaming a level there fails here.
          defined = {m.upper() for m in re.findall(r'(?m)^\|\s+\*\*(\w+)\*\*\s+\|', skill)}
          errs = []
          if not defined:
              errs.append("no severity rows found in SKILL.md's table")

          # Any all-caps token in a finding heading that looks like a severity claim.
          used = {t for t in re.findall(r'(?m)^###[^\n]*?\b([A-Z]{3,})\b', example)
                  if t not in ("FAIL", "PASS", "CWE", "README", "LLM", "AI", "TLS")}
          unknown = sorted(used - defined)
          if unknown:
              errs.append(f"undefined severity label(s) {unknown}; defined: {sorted(defined)}")

          # Split on the bucket headings; a missing heading means the example no longer
          # demonstrates the structure the skill mandates.
          marks = [("gates", "## 1. Rejection gates"), ("defects", "## 2. Defects"),
                   ("info", "## 3. Informational"), ("verdict", "## Verdict")]
          idx = {}
          for name, h in marks:
              i = example.find(h)
              if i < 0: errs.append(f"example missing section: {h}")
              idx[name] = i
          if all(v >= 0 for v in idx.values()):
              def section(a, b): return example[idx[a]:idx[b]]
              # Bucket-name mentions are legitimate; a *label* is an uppercase severity token.
              graded = set(defined)
              for name, nxt in (("gates", "defects"), ("info", "verdict")):
                  body = section(name, nxt)
                  # skip the heading line itself so "## 3. Informational" isn't a hit
                  body = body.split("\n", 1)[1] if "\n" in body else ""
                  bad = sorted({t for t in re.findall(r'\b([A-Z]{3,})\b', body)} & graded)
                  if bad:
                      errs.append(f"severity label(s) {bad} in the '{name}' bucket, which carries none")
              d = section("defects", "info")
              if not ({t for t in re.findall(r'\b([A-Z]{3,})\b', d)} & graded):
                  errs.append("Defects bucket has no severity label at all")
              if "Basis:" not in d:
                  errs.append("Defects bucket cites no basis for its severities")
          if errs:
              print("example review FAILED:"); [print("  -", e) for e in errs]; sys.exit(1)
          print(f"example OK: labels {sorted(used)}, buckets present and severity-scoped")
          PY
