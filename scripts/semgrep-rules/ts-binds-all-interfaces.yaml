# Dimension 17 (access control & agent authority). CWE-1327.
#
# WHY THIS EXISTS. An MCP server or local agent HTTP surface almost never has authN of its own -- the
# access control IS the loopback bind. `listen(port, "0.0.0.0")` removes it, exposing the endpoint to
# everything that can route to the host: the coffee-shop LAN, the container's bridge network, the
# corporate VPN subnet. `ruff`/`bandit` are Python-only and cannot see express/fastify/node `http`.
#
# WHY THIS IS A WARNING AND ts-wildcard-cors IS AN ERROR. Both widen reach, but the wildcard-CORS case
# is reachable from any web page the operator visits, while this one requires network adjacency. In a
# published container image, though, adjacency is the normal case rather than the exception -- which is
# why dimension 17 escalates this to High when the endpoint exposes tools or scan data and nothing
# authenticates the caller. Severity here is location-dependent, and the message says so.
#
# MEASURED against 1074 real TypeScript files from six MCP servers (the official `servers` and
# `typescript-sdk` repos, plus context7, Figma-Context-MCP, mcp-server-cloudflare, playwright-mcp;
# 13 further files failed to parse and were NOT analysed, so 1074 is the honest denominator, not 1087).
# 8 findings, ALL of them in `.examples.` / guide files, 0 in production paths.
#
# That measurement is the reason this rule changed. The earlier version reported 0 findings here and
# the header credited the corpus rather than the rule -- correctly, since that corpus had no `.listen(`
# at all. This one has 102 occurrences of `.listen(` and 17 files mentioning `0.0.0.0`, and the rule
# STILL reported 0. The cause was not a clean corpus: the dominant idiom in the current MCP SDK is a
# framework factory (`createMcpExpressApp({ host: "0.0.0.0" })`), which has no `.listen` receiver for
# the old pattern to bind. A zero that looks like good news and is actually a blind spot is precisely
# this skill's dimension 1, found in its own rule set.
#
# STILL NO FALSE-POSITIVE RATE IS CLAIMED, for a reason worth stating: all 8 hits are example code
# that binds broadly ON PURPOSE to demonstrate deployment, and 6 of them pair it with an explicit
# `allowedHosts` allowlist. Whether those are false positives depends on the question being asked --
# they are not defects, but they ARE the shape a reader copies into production. Counting them either
# way would overstate what was measured. What IS established: the rule fires on the real idiom, and it
# found no production defect in this corpus.
#
# KNOWN FALSE POSITIVES (measured; triage by reading):
#   * a containerized service that MUST bind 0.0.0.0 to be reachable from outside its namespace. This
#     is legitimate and common. The finding is still worth reading, because the question it asks is not
#     "is the bind wrong" but "what authenticates the caller once the bind is correct" -- and for a
#     container the answer is usually nothing.
#   * a test harness or example that binds broadly on purpose.
#
# KNOWN BLIND SPOTS:
#   * `listen(port)` with no host. Node's default for `http.Server` is effectively all interfaces, so
#     the commonest real exposure has NO construct to match at all -- it is an absence. This rule
#     cannot see it and neither can any pattern; it needs a human to ask what the default is for the
#     framework in use. This is the single biggest limit here, and the reason zero hits proves nothing.
#   * the host arriving from a parameter or an unresolvable expression (`process.env.HOST ?? "0.0.0.0"`).
#     A literal assigned to a local `const` one line earlier IS caught (constant propagation).
#   * `"::"` / `"[::]"` (the IPv6 any-address), `HOST=0.0.0.0` in a Dockerfile or compose file, and
#     `--host 0.0.0.0` passed to a dev server on the command line. Each is the same exposure in a
#     different vocabulary; none is matched here.
rules:
  - id: ts-binds-all-interfaces
    languages: [js, ts]
    severity: WARNING
    message: >-
      dim17: the server binds every network interface (`0.0.0.0`), not loopback. For a local agent or
      MCP server the loopback bind is usually the only access control there is, so this exposes the
      endpoint to the whole reachable network. Dimension 17 rates it High when the endpoint exposes
      tools or scan data and nothing authenticates the caller. Fix by binding `127.0.0.1`, or -- if a
      broad bind is genuinely required, as in a container -- by adding real authN, since the bind is
      no longer providing any. Related blind spot worth checking by hand: `listen(port)` with no host
      argument is also all-interfaces on Node, and has no construct for this rule to match.
    metadata:
      qr-dimension: 17
      cwe: "CWE-1327: Binding to an Unrestricted IP Address"
      confidence: MEDIUM
    pattern-either:
      # The trailing `...` covers the callback form too; measured to match both `listen(p, "0.0.0.0")`
      # and `listen(p, "0.0.0.0", () => {})` with a single pattern.
      - pattern: $A.listen($P, "0.0.0.0", ...)
      # Any call taking a `host: "0.0.0.0"` option, with NO receiver requirement. This deliberately
      # replaces the narrower `$A.listen({...})` spelling, which it subsumes (measured: it still
      # matches `server.listen({host: "0.0.0.0", port: P})`). The widening came from measuring the
      # rule against 1074 real MCP-server TS files, where the dominant idiom turned out to be a
      # framework FACTORY -- `createMcpExpressApp({ host: "0.0.0.0" })` -- not `.listen()` at all.
      # The receiver-bound pattern missed 8 real sites in the current MCP TypeScript SDK. Binding
      # the receiver to `.listen` looked more precise and simply did not match how these servers
      # are written.
      - pattern: '$F({..., host: "0.0.0.0", ...})'
